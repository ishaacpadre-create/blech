<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E8637C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <rect width="192" height="192" rx="44" fill="url(#shine)"/>
  <!-- B letter -->
  <text x="96" y="128" font-family="'Quicksand', Arial, sans-serif" font-size="110" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">B</text>
