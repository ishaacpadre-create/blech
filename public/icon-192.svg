    <line x1="10" y1="6" x2="8" y2="10" stroke="white" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Subtle trail dots -->
  <circle cx="148" cy="55" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="155" cy="58" r="1" fill="white" opacity="0.3"/>
  <circle cx="161" cy="62" r="0.7" fill="white" opacity="0.2"/>
